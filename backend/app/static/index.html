<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RezTV - Admin</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { margin-bottom: 5px; }
    section { background: white; margin-bottom: 30px; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    button { padding: 7px 12px; margin: 3px; cursor: pointer; border-radius: 5px; border: 1px solid #bbb; background: #eee; }
    button:hover { background: #ddd; }
    input[type=text], input[type=file], select { padding: 7px; margin: 4px 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .success { color: green; }
    .error { color: crimson; }
    .playlist-box { background: #fafafa; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #eee; }
    .library { display: flex; gap: 20px; align-items: flex-start; margin-top: 10px; }
    .folder-sidebar { width: 200px; flex-shrink: 0; border-right: 1px solid #eee; padding-right: 15px; }
    .folder-sidebar li { padding: 7px 8px; cursor: pointer; border-radius: 5px; border-bottom: none; }
    .folder-sidebar li:hover { background: #f0f0f0; }
    .folder-sidebar li.active { background: #e0e0e0; font-weight: bold; }
    .library-main { flex: 1; min-width: 0; }
    .folder-bar { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .station-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>RezTV Admin</h1>

  <!-- Station Name -->
  <section>
    <h2>Station Name</h2>
    <div class="station-row">
      <input type="text" id="stationName" placeholder="Enter station name" style="width: 300px;">
      <button onclick="saveStationName()">Save Station Name</button>
    </div>
    <p id="stationStatus"></p>
  </section>

  <!-- Upload -->
  <section>
    <h2>Upload Video</h2>
    <form id="uploadForm">
      <input type="file" id="videoFile" accept="video/*,image/gif,.gif,.mkv" required>
      <input type="text" id="uploadFolder" list="folderOptions" placeholder="Folder (optional)">
      <datalist id="folderOptions"></datalist>
      <button type="submit">Upload</button>
    </form>
    <p id="uploadStatus"></p>
  </section>

  <!-- Create Channel -->
  <section>
    <h2>Create Channel</h2>
    <input type="text" id="playlistName" placeholder="Channel name">
    <button onclick="createPlaylist()">Create Channel</button>
    <p id="playlistStatus"></p>
  </section>

  <!-- Media Library -->
  <section>
    <h2>Media Library</h2>
    <button onclick="loadMedia()">Refresh Media</button>
    <div class="library">
      <div class="folder-sidebar">
        <strong>Folders</strong>
        <ul id="folderList"></ul>
      </div>
      <div class="library-main">
        <div class="folder-bar" id="folderBar" style="display:none;">
          Add everything in <strong id="folderBarName"></strong> to
          <select id="folderChannelSelect"></select>
          <button onclick="addFolderToPlaylist()">Add Folder to Channel</button>
        </div>
        <ul id="mediaList"></ul>
      </div>
    </div>
  </section>

  <!-- Channels -->
  <section>
    <h2>Channels</h2>
    <button onclick="loadPlaylists()">Refresh Channels</button>
    <div id="playlistList"></div>
  </section>

  <script>
    const API = "";

    // ========== Station Name ==========
    async function loadStationName() {
      const res = await fetch(`${API}/settings`);
      const data = await res.json();
      document.getElementById("stationName").value = data.station_name || "RezTV";
    }

    async function saveStationName() {
      const name = document.getElementById("stationName").value.trim();
      if (!name) return alert("Please enter a station name");

      const res = await fetch(`${API}/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ station_name: name })
      });

      if (res.ok) {
        document.getElementById("stationStatus").innerHTML = `<span class="success">Station name saved</span>`;
      } else {
        document.getElementById("stationStatus").innerHTML = `<span class="error">Failed to save</span>`;
      }
    }

    // ========== Upload with Progress ==========
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("videoFile");
      const status = document.getElementById("uploadStatus");

      if (!fileInput.files[0]) {
        status.innerHTML = "Please select a file first.";
        return;
      }

      const file = fileInput.files[0];
      status.innerHTML = `
        <div>Uploading <strong>${file.name}</strong>...</div>
        <div style="margin-top:8px; background:#eee; border-radius:6px; overflow:hidden;">
          <div id="progressBar" style="height:18px; width:0%; background:#4caf50; text-align:center; color:white; font-size:12px; line-height:18px;">0%</div>
        </div>
      `;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("folder", document.getElementById("uploadFolder").value.trim());

      const xhr = new XMLHttpRequest();

      xhr.upload.addEventListener("progress", (event) => {
        if (event.lengthComputable) {
          const percent = Math.round((event.loaded / event.total) * 100);
          const bar = document.getElementById("progressBar");
          if (bar) {
            bar.style.width = percent + "%";
            bar.innerText = percent + "%";
          }
        }
      });

      xhr.addEventListener("load", () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          status.innerHTML = `<span class="success">Uploaded: ${data.filename} (ID: ${data.id}) to ${data.folder}. Converting to the station format now; it can be added to a channel once it shows "ready".</span>`;
          loadMedia();
          fileInput.value = "";
        } else {
          let detail = "";
          try { detail = JSON.parse(xhr.responseText).detail || ""; } catch (_) {}
          status.innerHTML = `<span class="error">Upload failed (${xhr.status}) ${detail}</span>`;
        }
      });

      xhr.addEventListener("error", () => {
        status.innerHTML = `<span class="error">Upload failed – network error</span>`;
      });

      xhr.open("POST", `${API}/upload`);
      xhr.send(formData);
    });

    // ========== Create Channel ==========
    async function createPlaylist() {
      const name = document.getElementById("playlistName").value.trim();
      if (!name) return alert("Please enter a channel name");

      const res = await fetch(`${API}/playlists`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      document.getElementById("playlistStatus").innerHTML = `<span class="success">Created: ${data.name} (ID: ${data.id})</span>`;
      document.getElementById("playlistName").value = "";
      loadPlaylists();
      loadMedia();
    }

    // ========== Load Media ==========
    let currentFolder = "";  // "" means all folders

    function selectFolder(name) {
      currentFolder = name;
      loadMedia();
    }

    async function loadMedia() {
      const mediaUrl = currentFolder ? `${API}/media?folder=${encodeURIComponent(currentFolder)}` : `${API}/media`;
      const [mediaRes, playlistsRes, foldersRes] = await Promise.all([
        fetch(mediaUrl),
        fetch(`${API}/playlists`),
        fetch(`${API}/media/folders`)
      ]);

      const media = await mediaRes.json();
      const playlists = await playlistsRes.json();
      const folders = await foldersRes.json();

      // Folder sidebar
      if (currentFolder && !folders.some(f => f.name === currentFolder)) currentFolder = "";
      const total = folders.reduce((sum, f) => sum + f.count, 0);
      document.getElementById("folderList").innerHTML =
        `<li class="${currentFolder === "" ? "active" : ""}" onclick="selectFolder('')">All media (${total})</li>` +
        folders.map(f => `<li class="${currentFolder === f.name ? "active" : ""}" onclick="selectFolder('${f.name}')">${f.name} (${f.count})</li>`).join("");
      document.getElementById("folderOptions").innerHTML = folders.map(f => `<option value="${f.name}">`).join("");

      // "Add whole folder to channel" bar
      const folderBar = document.getElementById("folderBar");
      folderBar.style.display = currentFolder ? "block" : "none";
      document.getElementById("folderBarName").innerText = currentFolder;
      document.getElementById("folderChannelSelect").innerHTML =
        `<option value="">Select channel...</option>` + playlists.map(p => `<option value="${p.id}">${p.name}</option>`).join("");

      const list = document.getElementById("mediaList");

      if (media.length === 0) {
        list.innerHTML = "<li>No media uploaded yet</li>";
        return;
      }

      const colors = { ready: "#2a7", pending: "#888", converting: "#c80", failed: "#c00" };
      const fmt = s => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "";
      if (media.some(m => m.status === "pending" || m.status === "converting")) {
        clearTimeout(window._convPoll);
        window._convPoll = setTimeout(loadMedia, 5000);
      }
      list.innerHTML = media.map(m => {
        const ready = m.status === "ready";
        const badge = `<span title="${(m.error || "").replace(/"/g, "&quot;")}" style="color:${colors[m.status] || "#888"}; font-weight:bold; font-size:0.85rem;">${m.status}</span>`;
        const options = playlists.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
        return `
          <li>
            <span>ID ${m.id}: ${m.original_filename || m.filename} <span style="color:#888; font-size:0.85rem;">[${m.folder}]</span> ${badge} <span style="color:#888; font-size:0.85rem;">${ready ? fmt(m.duration) : ""}</span>${m.status === "failed" && m.error ? `<br><small style="color:#c00;">${m.error.replace(/</g, "&lt;")}</small>` : ""}</span>
            <div>
              <button onclick="moveMedia(${m.id}, '${m.folder}')">Move</button>
              ${m.status === "failed" ? `<button onclick="retryConvert(${m.id})">Retry</button>` : ""}
              <select id="select-${m.id}" ${ready ? "" : "disabled"}>
                <option value="">Select channel...</option>
                ${options}
              </select>
              <button onclick="addToPlaylist(${m.id})" ${ready ? "" : "disabled title='Available once conversion is ready'"}>Add</button>
              <button onclick="deleteMedia(${m.id})" style="background:#ffdddd; color:#c00;">Delete</button>
            </div>
          </li>
        `;
      }).join("");
    }

    // ========== Add to Channel ==========
    async function addToPlaylist(mediaId) {
      const select = document.getElementById(`select-${mediaId}`);
      const playlistId = select.value;

      if (!playlistId) {
        alert("Please select a channel first");
        return;
      }

      const res = await fetch(`${API}/playlists/${playlistId}/media/${mediaId}`, {
        method: "POST"
      });

      if (res.ok) {
        alert(`Added media ${mediaId} to channel ${playlistId}`);
        loadPlaylists();
      } else {
        const err = await res.json();
        alert("Failed: " + (err.detail || "Unknown error"));
      }
    }

    // ========== Folders ==========
    async function retryConvert(mediaId) {
      const res = await fetch(`${API}/media/${mediaId}/convert`, { method: "POST" });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        alert(`Could not retry: ${d.detail || res.status}`);
      }
      loadMedia();
    }

    async function moveMedia(mediaId, current) {
      const folder = prompt("Move to folder (type a new name to create one):", current);
      if (folder === null || folder.trim() === "" || folder.trim() === current) return;

      const res = await fetch(`${API}/media/${mediaId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder: folder.trim() })
      });

      if (res.ok) {
        loadMedia();
        loadPlaylists();
      } else {
        alert("Failed to move media");
      }
    }

    async function addFolderToPlaylist() {
      const playlistId = document.getElementById("folderChannelSelect").value;
      if (!playlistId) return alert("Please select a channel first");

      const res = await fetch(`${API}/playlists/${playlistId}/folder`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folder: currentFolder })
      });
      const data = await res.json();

      if (res.ok) {
        const skipped = data.skipped ? ` (${data.skipped} already in the channel)` : "";
        const notReady = data.not_ready ? ` ${data.not_ready} not ready yet were left out.` : "";
        alert(`Added ${data.added.length} videos from ${data.folder} to channel ${playlistId}${skipped}.${notReady}`);
        loadPlaylists();
      } else {
        alert("Failed: " + (data.detail || "Unknown error"));
      }
    }

    // ========== Load Channels ==========
    // Several actions call loadPlaylists() back to back. Each call gets a number;
    // only the newest one is allowed to touch the page, and it swaps in a fully
    // built list in one step, so channels can no longer show up twice.
    let loadPlaylistsGen = 0;
    async function loadPlaylists() {
      const gen = ++loadPlaylistsGen;
      const res = await fetch(`${API}/playlists`);
      const playlists = await res.json();
      const container = document.getElementById("playlistList");
      if (gen !== loadPlaylistsGen) return;

      if (playlists.length === 0) {
        container.innerHTML = "<p>No channels yet</p>";
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const p of playlists) {
        const mediaRes = await fetch(`${API}/playlists/${p.id}/media`);
        const mediaItems = await mediaRes.json();
        if (gen !== loadPlaylistsGen) return;

        const mediaListHtml = mediaItems.length === 0
          ? `<p style="color:#888; margin:10px 0;">No videos in this channel</p>`
          : `<ul class="sortable" data-playlist-id="${p.id}" style="list-style:none; padding:0; margin:12px 0;">
              ${mediaItems.map(m => `
                <li draggable="true" data-id="${m.id}" style="padding:10px; margin:6px 0; background:#f0f0f0; border-radius:6px; cursor:grab; display:flex; justify-content:space-between; align-items:center;">
                  <span>${m.title || m.original_filename}${m.status && m.status !== "ready" ? ` <small style="color:#c00;">(${m.status}, skipped)</small>` : ""}</span>
                  <span style="color:#888; font-size:0.85rem;">
                    ID ${m.id}
                    <button onclick="removeFromPlaylist(${p.id}, ${m.id})" title="Remove from this channel (stays in the library)">Remove</button>
                  </span>
                </li>
              `).join("")}
             </ul>`;

        const box = document.createElement("div");
        box.className = "playlist-box";
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <strong>ID ${p.id}: <span id="channel-name-${p.id}">${p.name}</span></strong>
            <div>
              <button onclick="editChannelName(${p.id})">Edit Name</button>
            </div>
          </div>
          ${mediaListHtml}
          <div style="margin-top: 12px;">
            <button onclick="startStream(${p.id})">Start Stream</button>
            <button onclick="stopStream(${p.id})">Stop Stream</button>
            <button onclick="showStreamLog(${p.id})">Status &amp; Log</button>
            <a href="/hls/playlist_${p.id}/index.m3u8" target="_blank">Open Stream URL</a>
            <button onclick="deletePlaylist(${p.id})" style="background:#ffdddd; color:#c00; margin-left: 10px;">Delete Channel</button>
          </div>
          <p id="stream-status-${p.id}" style="margin-top:8px;"></p>
          <pre id="stream-log-${p.id}" style="display:none; max-height:300px; overflow:auto; background:#111; color:#ddd; padding:8px; font-size:0.8rem; white-space:pre-wrap;"></pre>
        `;
        fragment.appendChild(box);
      }
      if (gen !== loadPlaylistsGen) return;
      container.replaceChildren(fragment);

      enableDragAndDrop();
    }

    // ========== Edit Channel Name ==========
    async function editChannelName(id) {
      const current = document.getElementById(`channel-name-${id}`).innerText;
      const newName = prompt("Enter new channel name:", current);
      if (!newName || newName.trim() === "" || newName === current) return;

      const res = await fetch(`${API}/playlists/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: newName.trim() })
      });

      if (res.ok) {
        loadPlaylists();
      } else {
        alert("Failed to rename channel");
      }
    }

    // ========== Drag & Drop ==========
    function enableDragAndDrop() {
      document.querySelectorAll(".sortable").forEach(list => {
        let draggedItem = null;

        list.querySelectorAll("li").forEach(item => {
          item.addEventListener("dragstart", (e) => {
            draggedItem = item;
            e.dataTransfer.effectAllowed = "move";
            item.style.opacity = "0.5";
          });

          item.addEventListener("dragend", () => {
            item.style.opacity = "1";
            draggedItem = null;
          });

          item.addEventListener("dragover", (e) => e.preventDefault());

          item.addEventListener("drop", (e) => {
            e.preventDefault();
            if (draggedItem && draggedItem !== item) {
              const items = [...list.querySelectorAll("li")];
              const draggedIndex = items.indexOf(draggedItem);
              const targetIndex = items.indexOf(item);

              if (draggedIndex < targetIndex) {
                list.insertBefore(draggedItem, item.nextSibling);
              } else {
                list.insertBefore(draggedItem, item);
              }
              saveOrder(list);
            }
          });
        });
      });
    }

    async function saveOrder(list) {
      const playlistId = list.dataset.playlistId;
      const mediaIds = [...list.querySelectorAll("li")].map(li => parseInt(li.dataset.id));

      await fetch(`${API}/playlists/${playlistId}/reorder`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ media_ids: mediaIds })
      });
    }

    // ========== Start / Stop Stream ==========
    async function showStreamLog(playlistId) {
      const pre = document.getElementById(`stream-log-${playlistId}`);
      if (pre.style.display === "block") { pre.style.display = "none"; return; }
      const res = await fetch(`${API}/playlists/${playlistId}/status?lines=100`);
      const d = await res.json();
      if (!res.ok) { alert("Failed: " + (d.detail || "Unknown error")); return; }
      const state = !d.running ? "Stopped"
        : (d.ffmpeg_alive ? "On air" : "Restarting after a problem");
      const head = `Status: ${state} | restarts: ${d.restarts ?? 0}` +
        (d.last_exit_code != null ? ` | last exit code: ${d.last_exit_code}` : "");
      pre.textContent = head + "\n\n" + (d.log.length ? d.log.join("\n") : "(no log yet)");
      pre.style.display = "block";
    }

    async function startStream(playlistId) {
      const status = document.getElementById(`stream-status-${playlistId}`);
      status.innerText = "Starting stream...";

      const res = await fetch(`${API}/playlists/${playlistId}/start`, { method: "POST" });
      const data = await res.json();

      if (res.ok) {
        status.innerHTML = `<span class="success">Stream running! → <a href="${data.stream_url}" target="_blank">${data.stream_url}</a></span>`;
      } else {
        status.innerHTML = `<span class="error">Error: ${data.detail || JSON.stringify(data)}</span>`;
      }
    }

    async function stopStream(playlistId) {
      const status = document.getElementById(`stream-status-${playlistId}`);
      await fetch(`${API}/playlists/${playlistId}/stop`, { method: "POST" });
      status.innerText = "Stream stopped";
    }

    // ========== Remove from Channel ==========
    async function removeFromPlaylist(playlistId, mediaId) {
      if (!confirm(`Remove media ID ${mediaId} from channel ${playlistId}? It stays in the media library.`)) return;

      const res = await fetch(`${API}/playlists/${playlistId}/media/${mediaId}`, { method: "DELETE" });
      if (res.ok) {
        loadPlaylists();
      } else {
        alert("Failed to remove from channel");
      }
    }

    // ========== Delete ==========
    async function deleteMedia(mediaId) {
      if (!confirm(`Are you sure you want to delete media ID ${mediaId}?`)) return;

      const res = await fetch(`${API}/media/${mediaId}`, { method: "DELETE" });
      if (res.ok) {
        loadMedia();
        loadPlaylists();
      } else {
        alert("Failed to delete media");
      }
    }

    async function deletePlaylist(playlistId) {
      if (!confirm(`Are you sure you want to delete this channel?`)) return;

      const res = await fetch(`${API}/playlists/${playlistId}`, { method: "DELETE" });
      if (res.ok) {
        loadPlaylists();
        loadMedia();
      } else {
        alert("Failed to delete channel");
      }
    }

    // Initial load
    loadStationName();
    loadMedia();
    loadPlaylists();
  </script>
</body>
</html>
