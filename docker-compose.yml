services:
  db:
    image: postgres:16-alpine
    container_name: reztv-db
    environment:
      POSTGRES_USER: reztv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reztv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: reztv-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://reztv:${POSTGRES_PASSWORD}@db:5432/reztv
      MEDIA_PATH: /app/media
      HLS_PATH: /app/hls
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./media:/app/media
      - ./hls:/app/hls
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
