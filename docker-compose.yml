services:
  db:
    image: postgres:16-alpine
    container_name: reztv-db
    environment:
      POSTGRES_USER: reztv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reztv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: reztv-backend
    ports:
      - "127.0.0.1:8000:8000"   # only reachable through nginx on the same server
    environment:
      DATABASE_URL: postgresql://reztv:${POSTGRES_PASSWORD}@db:5432/reztv
      MEDIA_PATH: /app/media
      HLS_PATH: /app/hls
      LOG_PATH: /app/logs
      STREAM_LOG_MAX_KB: ${STREAM_LOG_MAX_KB:-1024}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
    volumes:
      - ./media:/app/media
      - ./hls:/app/hls
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
